name: Storefront performance and freshness
on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  checkout-integration:
    name: Checkout with isolated Medusa and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: florayn_checkout_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d florayn_checkout_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CHECKOUT_ISOLATED_TEST: "1"
      CONTACT_ISOLATED_TEST: "1"
      PRODUCT_MANAGER_ISOLATED_TEST: "1"
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/florayn_checkout_test_ci?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_ENV: test
      MEDUSA_DISABLE_TELEMETRY: "true"
      JWT_SECRET: checkout-ci-only-not-for-deployment
      COOKIE_SECRET: checkout-ci-only-not-for-deployment
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      # An empty URL would activate the warmer's deployed-site fallback.
      STOREFRONT_URL: http://127.0.0.1:1
      REVALIDATE_SECRET: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Migrate the disposable database without catalog seeding
        working-directory: apps/backend
        run: npx medusa db:migrate --skip-scripts
      - name: Verify quotes, changed totals and exactly one COD order
        working-directory: apps/backend
        run: npx medusa exec ./src/scripts/verify-checkout-isolated.ts
      - name: Verify the scoped checkout migration preflight and idempotence
        working-directory: apps/backend
        run: |
          npx medusa exec ./src/scripts/migrate-checkout-settings.ts
          npx medusa exec ./src/scripts/migrate-checkout-settings.ts apply Migration20260920194733
      - name: Verify Product Manager creation, editing, variants and stock
        working-directory: apps/backend
        run: npx medusa exec ./src/scripts/verify-product-manager-isolated.ts
      - name: Verify persisted contact settings and ordered editable FAQs
        working-directory: apps/backend
        run: npx medusa exec ./src/scripts/verify-contact-isolated.ts
      - name: Verify the scoped contact migration preflight and idempotence
        working-directory: apps/backend
        run: |
          npx medusa exec ./src/scripts/migrate-contact-settings.ts
          npx medusa exec ./src/scripts/migrate-contact-settings.ts apply Migration20260921064114
      - name: Verify the scoped tracking and privacy migrations preflight and idempotence
        working-directory: apps/backend
        run: |
          npx medusa exec ./src/scripts/migrate-tracking.ts
          npx medusa exec ./src/scripts/migrate-tracking.ts apply Migration20260928090000
          npx medusa exec ./src/scripts/migrate-privacy-settings.ts
          npx medusa exec ./src/scripts/migrate-privacy-settings.ts apply Migration20260928091000

  regression:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/storefront/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/storefront ci
      - run: npm test
      - name: Verify cache freshness with isolated Redis
        working-directory: apps/storefront
        run: node --test tests/cache-redis.integration.cjs
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: Verify actual Next.js invalidation and unrelated cache reuse
        working-directory: apps/storefront
        run: node tests/cache-next.integration.cjs
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/1
      - name: Build backend and admin with Medusa lint
        run: npm --prefix apps/backend run build
        env:
          MEDUSA_DISABLE_TELEMETRY: "1"
      - name: Build against the local synthetic catalog
        run: |
          node apps/storefront/tests/fixtures/mock-store-api.cjs > "$RUNNER_TEMP/storefront-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:9901/__audit/health
          npm --prefix apps/storefront run build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:9901
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_local_fixture_only
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/apps/storefront/tests/fixtures/google-fonts.cjs
          NEXT_TELEMETRY_DISABLED: "1"

  # TRACKING.md section 11 (B7): build the merge-base and the head in this one
  # job with the same fixture environment and compare them. Never a committed
  # baseline: hashes and the platform move the numbers between machines.
  client-budget:
    name: Client JS budget against the merge-base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - name: Check out the merge-base beside the head
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$(git merge-base "$PR_BASE_SHA" HEAD || true)"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          # A new branch pushes an all-zero "before"; a force push can name a commit that is gone.
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD~1)"
          fi
          echo "Comparing against $base_sha"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          git worktree add "$RUNNER_TEMP/base" "$base_sha"
      - run: npm --prefix apps/storefront ci
      - run: npm --prefix "$RUNNER_TEMP/base/apps/storefront" ci
      - name: Build the merge-base and the head against the local synthetic catalog and compare
        run: |
          node apps/storefront/tests/fixtures/mock-store-api.cjs > "$RUNNER_TEMP/storefront-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:9901/__audit/health
          npm --prefix "$RUNNER_TEMP/base/apps/storefront" run build
          npm --prefix apps/storefront run build
          node apps/storefront/scripts/check-client-budget.cjs --base "$RUNNER_TEMP/base/apps/storefront/.next" --head apps/storefront/.next
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:9901
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_local_fixture_only
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/apps/storefront/tests/fixtures/google-fonts.cjs
          NEXT_TELEMETRY_DISABLED: "1"
